{% extends 'base.html' %}
{% load i18n %}
{% block title %}Reset Password{% endblock %}
{% block page_title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-md">
<div class="card">
  <p class="text-slate-600 mb-5">Reset password for <strong>{{ obj.get_full_name }}</strong></p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div><label class="form-label">New Password</label><input type="password" name="new_password" required minlength="8" class="form-input" /></div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Reset Password</button>
      <a href="{% url 'user_list' %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
