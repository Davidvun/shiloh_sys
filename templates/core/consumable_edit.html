{% extends 'base.html' %}
{% load i18n %}
{% block title %}Edit Consumable{% endblock %}
{% block page_title %}Edit Item{% endblock %}
{% block page_subtitle %}Update details for {{ c.name }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="card">
    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="form-label">Item Name <span class="text-red-500">*</span></label>
          <input name="name" required class="form-input" value="{{ c.name }}" />
        </div>
        <div>
          <label class="form-label">Category</label>
          <select name="category" class="form-input">
            {% for val, label in categories %}
            <option value="{{ val }}" {% if val == c.category %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="form-label">Unit</label>
          <input name="unit" class="form-input" value="{{ c.unit }}" placeholder="tablet, ml, piece…" />
        </div>
        <div>
          <label class="form-label">Unit Price <span class="text-xs font-normal text-slate-400">({{ currency }})</span></label>
          <input name="unit_price" type="number" step="0.01" min="0" class="form-input" value="{{ c.unit_price }}" placeholder="0.00" />
        </div>
        <div>
          <label class="form-label">Description</label>
          <textarea name="description" rows="3" class="form-input">{{ c.description }}</textarea>
        </div>
        <div class="flex gap-3 pt-2">
          <button type="submit" class="btn-primary flex-1 justify-center">Save Changes</button>
          <a href="{% url 'consumables_list' %}" class="btn-secondary flex-1 justify-center">Cancel</a>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
