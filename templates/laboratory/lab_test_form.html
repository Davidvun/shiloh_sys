{% extends 'base.html' %}
{% load i18n %}
{% block title %}Edit Lab Test{% endblock %}
{% block page_title %}Edit Lab Test{% endblock %}
{% block page_subtitle %}{{ test.name }}{% endblock %}
{% block content %}
<div class="max-w-lg">
<div class="card">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="form-label">Category</label>
      <select name="category" class="form-input">
        {% for c in categories %}<option value="{{ c.pk }}" {% if c.pk == test.category_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
      </select>
    </div>
    <div><label class="form-label">Test Name</label><input name="name" required value="{{ test.name }}" class="form-input" /></div>
    <div>
      <label class="form-label">Price <span class="text-xs font-normal text-slate-400">({{ currency }})</span></label>
      <input name="default_price" type="number" step="0.01" min="0" value="{{ test.default_price }}" class="form-input" placeholder="0.00" />
    </div>
    <label class="flex items-center gap-2 text-sm"><input type="checkbox" name="is_active" {% if test.is_active %}checked{% endif %} /> Active</label>
    <div class="flex gap-3 pt-2">
      <button class="btn-primary">Save</button>
      <a href="{% url 'lab_catalog' %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
