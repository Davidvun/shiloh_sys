{% extends 'base.html' %}
{% load i18n %}
{% block title %}Register Patient{% endblock %}
{% block page_title %}Register New Patient{% endblock %}
{% block content %}
<div class="max-w-2xl">
<div class="card">
  <form method="post" class="space-y-5">
    {% csrf_token %}
    <div><label class="form-label">Full Name</label><input name="full_name" required class="form-input" placeholder="Patient's full name" /></div>
    <div class="grid grid-cols-2 gap-4">
      <div><label class="form-label">Age</label><input type="number" name="age" required min="0" max="150" class="form-input" /></div>
      <div><label class="form-label">Gender</label>
        <select name="gender" required class="form-input">
          <option value="">Select gender</option>
          <option value="M">Male</option>
          <option value="F">Female</option>
          <option value="O">Other</option>
        </select>
      </div>
    </div>
    <div><label class="form-label">Phone</label><input name="phone" required class="form-input" placeholder="+250..." /></div>
    <div><label class="form-label">Address</label><textarea name="address" required class="form-input" rows="2" placeholder="Patient's address"></textarea></div>
    <div>
      <label class="form-label">Insurance (optional)</label>
      <select name="insurance" class="form-input">
        <option value="">No insurance (patient pays 100%)</option>
        {% for ins in insurances %}
        <option value="{{ ins.pk }}">{{ ins.name }} (covers {{ ins.coverage_percentage }}%)</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Register Patient</button>
      <a href="{% url 'patient_list' %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
