{% extends 'base.html' %}
{% load i18n %}
{% block title %}New Visit{% endblock %}
{% block page_title %}Create Visit{% endblock %}
{% block page_subtitle %}{{ patient.full_name }} — {{ patient.patient_id }}{% endblock %}
{% block content %}
<div class="max-w-lg">
<div class="card">
  <form method="post" class="space-y-5">
    {% csrf_token %}

    <div>
      <label class="form-label">Assign Doctor</label>
      <select name="doctor" required class="form-input">
        <option value="">Select a doctor</option>
        {% for d in doctors %}
        <option value="{{ d.pk }}">Dr. {{ d.get_full_name }}{% if d.specialty %} ({{ d.get_specialty_display }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="form-label">Notes (optional)</label>
      <textarea name="notes" class="form-input" rows="2" placeholder="Any notes about this visit..."></textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Create Visit</button>
      <a href="{% url 'patient_detail' pk=patient.pk %}" class="btn-secondary">Cancel</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
